[project]
name = "dr-core"
version = "0.1.0"
description = "DeepResearch research-assurance layer for the DeerFlow fork (tool-free claude -p model plane, claim ledger, verification)"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.3.3",
    "langchain>=1.2.15",
    "langgraph>=1.1.9",
    "pydantic>=2.0",
    "markdown>=3.0",
    "pyyaml>=6.0",
    "certifi>=2024.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dr_core"]
