# --------------------------------------------------------------------------
# connectors.yaml — machine-readable source of truth for the deep-research harness.
#
# This file, plus `install.sh --probe`, is authoritative. CONNECTORS.md is human
# documentation of what is recorded here, not an authority of its own. When a
# connector moves, dies, or changes auth, edit this file and re-probe; do not rely
# on prose anywhere else staying in sync.
#
# Row schema
# ----------
#   name           unique id, referenced by `fallback:` and by profile docs
#   type           unstructured | structured | graph
#                    unstructured = pages/PDFs you crawl + quote-extract
#                    structured   = typed-query data APIs parsed into data records
#                    graph        = discovery / citation graphs (metadata + edges)
#   tier           0 always wired | 1 per-profile anchor (MCP only when active) | 2 runtime REST, no MCP
#   profiles       which profiles use it; `all` for Tier 0
#   access         mcp | rest | mcp+rest | sql
#                    sql = direct database connection (e.g. WRDS); no MCP/REST fragment,
#                    probed via a bare TCP connect, tooling is a separate initiative
#   endpoint       MCP endpoint or primary REST base
#   rest_endpoint  the substrate REST base when access is mcp (REST is substrate, MCP is ergonomics)
#   auth           env var holding the credential, or `none`
#   launcher       how an MCP is started: uvx | npx | http (hosted) | none (rest-only)
#   probe_url      lightweight GET target for reachability; omit if none is safe/cheap
#   probe_auth     (optional) how the probe authenticates the probe_url when the key is set:
#                    query:NAME (append ?NAME=key) | header:NAME | bearer | token
#                    omit when the endpoint answers without auth (a bare reachability GET)
#   durability     substrate (OSS lib / official primary API) | stable-api | fragile-wrapper
#   rate_limit     free-tier ceiling in human terms
#   throughput_note (optional) behavior under five-way fan-out, for capped connectors
#   last_verified  YYYY-MM-DD the row was checked against primary sources
#   fallback       connector name to fall to on 429 / auth failure, or null
#
# Enum discipline: `type`, `tier`, `access`, `durability`, and `launcher` are
# closed sets. The probe validates them; an unknown value is a hard error, not a warning.

connectors:

  # ----------------------------------------------------------------------------
  # TIER 0 — retrieval backbone. Always wired. Used by every profile.
  # ----------------------------------------------------------------------------

  - name: tavily
    type: unstructured
    tier: 0
    profiles: all
    access: mcp+rest
    endpoint: tavily-mcp
    rest_endpoint: https://api.tavily.com
    auth: TAVILY_API_KEY
    launcher: npx
    probe_url: https://api.tavily.com
    durability: stable-api
    rate_limit: "1,000 credits/mo free; ~$8/1k PAYG"
    throughput_note: "Standing search fallback for the whole harness; reliable under concurrent search agents where SearXNG throttles"
    last_verified: 2026-06-23
    fallback: searxng

  - name: searxng
    type: unstructured
    tier: 0
    profiles: all
    access: mcp
    endpoint: SEARXNG_URL
    rest_endpoint: SEARXNG_URL
    auth: SEARXNG_URL
    launcher: uvx
    probe_url: null
    durability: fragile-wrapper
    rate_limit: "self-host, free; upstream engines throttle under concurrency"
    throughput_note: "Throttles under five-way fan-out; Tavily is the standing fallback, not the other way round"
    last_verified: 2026-06-23
    fallback: tavily

