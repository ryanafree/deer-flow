# Profile: Legal — distilled from the old harness's profiles/legal/CLAUDE.md.
# Verify is on by default and the deterministic Eyecite/CourtListener citation gate
# runs on every case cite. No academic core (openalex/semantic_scholar) for Legal.
name: legal
tool_allowlist:
  - tavily
  - searxng
  - crawl4ai
  - docling
  - jina_reader
  - courtlistener
  - courtlistener_rest
  - govinfo
  - federal_register
  - regulations_gov
  - congress_gov
  - openstates
model_tiers:
  gruntwork: or-cheap
  verify: claude-verify  # q.5 2026-07-10: subscription shim default (or-sonnet = explicit OpenRouter fallback)
  top: claude-top
depth_default: standard
